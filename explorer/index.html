<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockchain Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>Blockchain Explorer</h1>
        <div class="controls">
          <label>
            Node URL
            <input id="nodeUrl" type="text" value="http://127.0.0.1:5001" />
          </label>
          <button id="refreshBtn">Refresh</button>
        </div>
      </header>

      <main>
        <section class="panel">
          <h2>Node Status</h2>
          <div id="nodeStatus" class="card empty">Loading...</div>
        </section>

        <section class="panel split">
          <div>
            <h2>Addresses</h2>
            <div id="addressesList" class="list empty">Loading...</div>
          </div>
          <div>
            <h2>Peers</h2>
            <div id="peersList" class="list empty">Loading...</div>
          </div>
        </section>

        <section class="panel">
          <h2>Mempool</h2>
          <div id="mempoolList" class="list empty">Loading...</div>
        </section>

        <section class="panel">
          <h2>Blocks</h2>
          <div id="blocksList" class="blocks empty">Loading...</div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
